9. Updated eden.toml
toml
[image]
name      = "eden"
arch      = "x86_64"
slots     = 2
grove     = "initgrove.img"

[gardener]
sovereignty       = 3
slot_key          = "self"        # or "owner:/keys/owner.pub"
model             = "/Models/gardener-8b-q4k.gguf"
embed_model       = "/Models/embed-small.gguf"
planners          = 4
agent_cores       = [0]            # dedicated core(s) for the @core loop; planners float
max_depth         = 6
evolution         = true
network_fetch     = true           # allow pulling models/specs/source from the network

[continuity]
ab_slots        = true
boot_watchdog_s = 90
crash_budget    = 3
shadow_required = true
pstore_mib      = 64

[qemu]
machine = "q35"  mem = "16G"  cpu = "host"  nested = true    # nested virt for Shadow.boot
devices = ["virtio-gpu-pci", "virtio-blk-pci", "virtio-net-pci", "virtio-keyboard-pci", "virtio-mouse-pci"]
bash
# run/qemu-x86_64.sh (excerpt)
qemu-system-x86_64 -M q35 -m 16G -smp 8 -cpu host,+vmx -enable-kvm \
  -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \
  -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \            # slot vars live here
  -drive file=build/eden.img,if=none,id=d0,format=raw -device virtio-blk-pci,drive=d0 \
  -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci \
  -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
  -serial mon:stdio
